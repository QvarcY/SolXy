# GitHub Actions workflow — automātiska publicēšana uz GitHub Pages
# ============================================================

name: Deploy SolXy to GitHub Pages

# === PALAIŠANAS NOTEIKUMI ===
on:
  # Palaiž, kad push uz main zaru
  push:
    branches:
      - main
      - master

  # Ļauj palaist manuāli no Actions cilnes
  workflow_dispatch:

# === ATĻAUNAS ===
permissions:
  contents: read
  pages: write
  id-token: write

# === VIENLAIKUS PALAIŠANA ===
concurrency:
  group: "pages"
  cancel-in-progress: false

# === DARBI ===
jobs:
  # ------------------------------------------------------------
  # 1. DARBS: Būvēšana (statiska vietne — nekas nav jābūvē, bet
  #    sagatavojam artefaktu augšupielādei)
  # ------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      # === 1. SOLIS: Checkout ===
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # === 2. SOLIS: Sagatavo Pages ===
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # === 3. SOLIS: Pārbauda, vai nav JavaScript ===
      - name: Verify no JavaScript files
        run: |
          echo "🔍 Pārbauda, vai projektā nav .js failu..."
          JS_FILES=$(find . -type f -name "*.js" \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./.github/*" || true)

          if [ -n "$JS_FILES" ]; then
            echo "❌ Atrasti JavaScript faili:"
            echo "$JS_FILES"
            echo ""
            echo "SolXy projektā nedrīkst būt JavaScript!"
            exit 1
          fi

          echo "✅ Nav atrasts neviens .js fails. Lieliski!"

      # === 4. SOLIS: Pārbauda HTML failu esamību ===
      - name: Verify HTML files
        run: |
          echo "🔍 Pārbauda HTML failus..."
          HTML_COUNT=$(find . -type f -name "*.html" -not -path "./.git/*" | wc -l)
          echo "📄 Atrasti $HTML_COUNT HTML faili."

          if [ "$HTML_COUNT" -lt 15 ]; then
            echo "⚠️  Brīdinājums: mazāk par 15 HTML failiem. Pārbaudi struktūru."
          fi

      # === 5. SOLIS: Pārbauda CSS failu esamību ===
      - name: Verify CSS files
        run: |
          echo "🔍 Pārbauda CSS failus..."
          CSS_COUNT=$(find ./css -type f -name "*.css" 2>/dev/null | wc -l)
          echo "🎨 Atrasti $CSS_COUNT CSS faili."

          if [ "$CSS_COUNT" -lt 30 ]; then
            echo "⚠️  Brīdinājums: mazāk par 30 CSS failiem. Pārbaudi struktūru."
          fi

      # === 6. SOLIS: Sagatavo artefaktu ===
      - name: Prepare artifact
        run: |
          echo "📦 Sagatavo artefaktu..."
          mkdir -p _site

          # Kopē visus nepieciešamos failus
          cp -r *.html _site/ 2>/dev/null || true
          cp -r css _site/ 2>/dev/null || true
          cp -r planets _site/ 2>/dev/null || true
          cp -r moons _site/ 2>/dev/null || true
          cp -r data _site/ 2>/dev/null || true
          cp -r assets _site/ 2>/dev/null || true

          # Kopē dokumentāciju (izņemot .md failus, kas nav nepieciešami)
          cp LICENSE _site/ 2>/dev/null || true

          # Pievieno .nojekyll, lai GitHub Pages neapstrādā ar Jekyll
          touch _site/.nojekyll

          echo "✅ Artefakts sagatavots:"
          ls -la _site/

      # === 7. SOLIS: Augšupielādē artefaktu ===
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  # ------------------------------------------------------------
  # 2. DARBS: Publicēšana
  # ------------------------------------------------------------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # === 1. SOLIS: Publicē uz GitHub Pages ===
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # === 2. SOLIS: Paziņojums ===
      - name: Deployment summary
        run: |
          echo "🚀 SolXy publicēts!"
          echo "🌐 URL: ${{ steps.deployment.outputs.page_url }}"
          echo ""
          echo "© 2026 · QvarcY · MIT Licence"